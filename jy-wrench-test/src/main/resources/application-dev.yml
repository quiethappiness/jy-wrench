server:
    port: 9191
spring:
    elasticsearch:
        uris: http://192.168.247.133:9200  # 根据你的Docker ES配置填写
        # 如果ES启用了安全认证，还需配置用户名和密码
        # username: elastic
        # password: your_password
# 小傅哥扳手通用组件配置
jy:
    wrench:
        config:
            system: test-system
            register:
                # redis host
                host: 192.168.247.133
                # redis port
                port: 16379
        # 任务调度配置
        task:
            job:
                enabled: false
                pool-size: 5
                thread-name-prefix: "test-task-scheduler-"
                wait-for-tasks-to-complete-on-shutdown: true
                await-termination-seconds: 30
                refresh-interval: 30000
                clean-invalid-tasks-cron: "0 0/5 * * * ?"
        methode:
            enabled: true
        traffic:
            hystrix:
                enabled: true
            ratemiter:
                enabled: true
            whitelist:
                enabled: true
                rules:
                    -   uri: /api/v1/index/**
                        limit: 1000
                        timeUnit: HOURS
                        whiteList:
                            USER_ID:
                                - "1001"
                                - "1002"
                                - "admin"
                            IP:
                                - "192.168.1.100"
                                - "10.0.0.0/8"
                    -   uri: /api/order/**
                        limit: 100
                        timeUnit: MINUTES
                        whiteList:
                            USER_ID:
                                - "vip-user"
                            PHONE:
                                - "13800138000"
                                - "13900139000"


# 日志
logging:
    level:
        root: debug
    config: classpath:logback-spring.xml
thread:
    pool:
        executor:
            config:
                core-pool-size: 20
                max-pool-size: 50
                keep-alive-time: 5000
                policy: CallerRunsPolicy
                block-queue-size: 5000