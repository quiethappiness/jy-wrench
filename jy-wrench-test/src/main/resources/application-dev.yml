# 小傅哥扳手通用组件配置
jy:
    wrench:
        config:
            dynamic:
                system: test-system
            # 任务调度配置
            task:
                job:
                    enabled: false
                    pool-size: 5
                    thread-name-prefix: "test-task-scheduler-"
                    wait-for-tasks-to-complete-on-shutdown: true
                    await-termination-seconds: 30
                    refresh-interval: 30000
                    clean-invalid-tasks-cron: "0 0/5 * * * ?"
            methode:
                enabled: true
            traffic:
                hystrix:
                    enabled: true
                ratemiter:
                    enabled: true
                whitelist:
                    enabled: true
                    rules:
                        -   uri: /api/v1/index/**
                            limit: 1000
                            timeUnit: HOURS
                            whiteList:
                                USER_ID:
                                    - "1001"
                                    - "1002"
                                    - "admin"
                                IP:
                                    - "192.168.1.100"
                                    - "10.0.0.0/8"
                        -   uri: /api/order/**
                            limit: 100
                            timeUnit: MINUTES
                            whiteList:
                                USER_ID:
                                    - "vip-user"
                                PHONE:
                                    - "13800138000"
                                    - "13900139000"
            db-router:
                jdbc:
                    datasource:
                        dbCount: 2
                        tbCount: 4
                        map:
                            db01:
                                driver-class-name: com.mysql.cj.jdbc.Driver
                                url: jdbc:mysql://127.0.0.1:13306/bugstack_01?useUnicode=true
                                username: root
                                password: 123456
                            db02:
                                driver-class-name: com.mysql.cj.jdbc.Driver
                                url: jdbc:mysql://127.0.0.1:13306/bugstack_02?useUnicode=true
                                username: root
                                password: 123456
        util:
            redisson:
                # redis host
                host: 127.0.0.1
                # redis port
                port: 16379
mybatis:
    mapper-locations: classpath:/mybatis/mapper/*.xml
    config-location: classpath:/mybatis/config/mybatis-config.xml
    
    # 路由配置



# 日志
logging:
    level:
        root: debug
    config: classpath:logback-spring.xml
thread:
    pool:
        executor:
            config:
                core-pool-size: 20
                max-pool-size: 50
                keep-alive-time: 5000
                policy: CallerRunsPolicy
                block-queue-size: 5000